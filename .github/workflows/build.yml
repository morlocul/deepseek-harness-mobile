name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Needed so the release step can create GitHub Releases with the APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # If signing secrets are set, sign the release; otherwise it falls back
      # to the debug key (still installable for a beta).
      - name: Write keystore.properties from secrets
        run: |
          if [ -n "${{ secrets.SIGNING_STORE }}" ]; then
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> keystore.properties
            echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> keystore.properties
            echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> keystore.properties
            echo "${{ secrets.SIGNING_STORE }}" | base64 -d > keystore.jks
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-apk
          path: app/build/outputs/apk/release/app-release.apk

  # Attach the APK to a GitHub Release when a tag like v1.2 is pushed.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-apk
          path: apk
      - uses: softprops/action-gh-release@v2
        with:
          files: apk/app-release.apk
          generate_release_notes: true
